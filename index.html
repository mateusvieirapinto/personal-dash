<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>NOCview PD</title>
  </head>
  <body>
    <main>
      <header>
        <figure>
          <img
            class="logoheader1"
            src="https://images.builderservices.io/s/cdn/v1.0/i/m?url=https%3A%2F%2Fstorage.googleapis.com%2Fproduction-hostgator-brasil-v1-0-2%2F882%2F1979882%2FbqYSLXza%2F19fc5a42f591445aad365e5fe3af0768&methods=resize%2C500%2C5000"
            alt="Logotipo NOCview"
          />
          <figcaption id="logoheader1">Logotipo da NOCview</figcaption>
        </figure>
        <div></div>
        <div class="header-title">
          <h1>Painel de Monitoramento Pessoal</h1>
        </div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </header>
      <section class="panels">
        <div class="panel panel-0">
          <img src="./assets/icons/verao.svg" alt="Ícone Calendário" />Previsão
          do Tempo
        </div>
        <div class="panel panel-1">
          <img src="./assets/icons/relogio.svg" alt="Ícone Calendário" />Horas
          Dormidas
        </div>
        <div class="panel panel-2">
          <img src="./assets/icons/fitness.svg" alt="Ícone Calendário" />Treinos
          na Semana
        </div>
        <div class="panel panel-3">
          <img src="./assets/icons/documento.svg" alt="Ícone Calendário" />Meta
          de Leitura
        </div>
        <div class="panel panel-4">
          <img
            src="./assets/icons/calendario.svg"
            alt="Ícone Calendário"
          />Agenda
        </div>

        <div class="panel panel-5">
          <img src="./assets/icons/humor.svg" alt="Ícone Calendário" />Humor do
          Dia
        </div>
        <div class="panel panel-6">
          <img src="./assets/icons/dolar.svg" alt="Ícone Calendário" />Meta
          Finaceira
        </div>
        <div class="panel panel-7">
          <img
            src="./assets/icons/lembrete.svg"
            alt="Ícone Calendário"
          />Lembrete
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
